name: Fieldglass
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Fieldglass:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fieldglass.workbench
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
  FieldglassTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests]
    dependencies:
      - target: Fieldglass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fieldglass.workbench.tests
        GENERATE_INFOPLIST_FILE: YES
  FieldglassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Fieldglass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fieldglass.workbench.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Fieldglass:
    build:
      targets:
        Fieldglass: all
    test:
      targets: [FieldglassTests, FieldglassUITests]
