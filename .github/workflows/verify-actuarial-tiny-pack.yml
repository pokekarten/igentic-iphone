name: Verify actuarial tiny model pack

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-actuarial-tiny-pack.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actuarial-tiny-pack-verification
  cancel-in-progress: false

jobs:
  verify-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: actuarial-base-weights-2026-08-31
      MODEL_ID: tiny-actuarial-pipeline
      UPSTREAM_REPO: HuggingFaceTB/SmolLM2-135M
      UPSTREAM_REVISION: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
      TOKENIZER_REVISION: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
      EXPECTED_ARCHIVE_SHA256: 1b9b273838a337b43daaaf997cb37ffe9d377f9973438c9dcf1a99e517e64799
      EXPECTED_INSPECT_BLOB_SHA: 7ca28772fbf6c072a804a6a8265611a8998b768f
      SLM_MAIN_SHA: ad69c4778a007a64917a5c6b3107d69efa0bc410
    steps:
      - name: Download exact release asset
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/actuarial-tiny-verify"
          mkdir -p "$WORK"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'tiny-actuarial-pipeline.tar' \
            --dir "$WORK"
          echo "$EXPECTED_ARCHIVE_SHA256  $WORK/tiny-actuarial-pipeline.tar" | sha256sum --check --strict
          mkdir -p "$WORK/unpacked"
          tar -xf "$WORK/tiny-actuarial-pipeline.tar" -C "$WORK/unpacked"
          test -f "$WORK/unpacked/tiny-actuarial-pipeline/config.json"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "PACK=$WORK/unpacked/tiny-actuarial-pipeline" >> "$GITHUB_ENV"

      - name: Materialize canonical pack inspector
        shell: bash
        run: |
          set -euo pipefail
          cat > "$WORK/inspect_model_pack.py" <<'PY'
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          from pathlib import Path
          from typing import Any

          WEIGHT_SUFFIXES = {".safetensors", ".bin", ".gguf", ".pt", ".pth"}
          TRAINABLE_SUFFIXES = {".safetensors", ".bin"}
          TOKENIZER_NAMES = {
              "tokenizer.json",
              "tokenizer.model",
              "tokenizer_config.json",
              "special_tokens_map.json",
              "vocab.json",
              "merges.txt",
          }
          DISALLOWED_NAMES = {
              ".env",
              "credentials.json",
              "secrets.json",
              "token",
              "token.txt",
              "api_key",
              "api_key.txt",
          }


          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def stable_json(value: Any) -> str:
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))


          def inspect_pack(pack_path: Path) -> dict[str, Any]:
              root = pack_path.expanduser().resolve()
              if not root.is_dir():
                  raise ValueError(f"model pack must be an existing directory: {root}")

              config_path = root / "config.json"
              if not config_path.is_file():
                  raise ValueError("model pack is missing config.json")

              files: list[dict[str, Any]] = []
              weight_files: list[str] = []
              tokenizer_files: list[str] = []
              custom_code_files: list[str] = []
              total_bytes = 0

              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise ValueError(f"symlinks are not allowed in model packs: {path}")
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root).as_posix()
                  if path.name.casefold() in DISALLOWED_NAMES:
                      raise ValueError(f"disallowed credential-like file in model pack: {relative}")
                  size = path.stat().st_size
                  digest = sha256_file(path)
                  files.append({"path": relative, "bytes": size, "sha256": digest})
                  total_bytes += size
                  if path.suffix.casefold() in WEIGHT_SUFFIXES:
                      weight_files.append(relative)
                  if path.name in TOKENIZER_NAMES or path.name.startswith("tokenizer"):
                      tokenizer_files.append(relative)
                  if path.suffix.casefold() == ".py":
                      custom_code_files.append(relative)

              if not weight_files:
                  raise ValueError("model pack contains no recognized weight file")
              if not tokenizer_files:
                  raise ValueError("model pack contains no recognized tokenizer files")

              try:
                  config = json.loads(config_path.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise ValueError("config.json is not valid UTF-8 JSON") from exc
              if not isinstance(config, dict):
                  raise ValueError("config.json must contain a JSON object")

              trainable_weights = [name for name in weight_files if Path(name).suffix.casefold() in TRAINABLE_SUFFIXES]
              gguf_weights = [name for name in weight_files if Path(name).suffix.casefold() == ".gguf"]
              if trainable_weights and gguf_weights:
                  pack_kind = "mixed_training_and_inference"
              elif trainable_weights:
                  pack_kind = "huggingface_trainable"
              elif gguf_weights:
                  pack_kind = "gguf_inference_only"
              else:
                  pack_kind = "unsupported_training_weights"

              identity_payload = "\n".join(
                  f"{entry['sha256']}  {entry['bytes']}  {entry['path']}" for entry in files
              ) + "\n"
              pack_sha256 = hashlib.sha256(identity_payload.encode("utf-8")).hexdigest()

              return {
                  "schema_version": "0.1",
                  "pack_kind": pack_kind,
                  "pack_sha256": pack_sha256,
                  "file_count": len(files),
                  "total_bytes": total_bytes,
                  "weight_files": weight_files,
                  "trainable_weight_files": trainable_weights,
                  "gguf_weight_files": gguf_weights,
                  "tokenizer_files": tokenizer_files,
                  "custom_code_files": custom_code_files,
                  "requires_explicit_trust_local_code": bool(custom_code_files),
                  "config_summary": {
                      "model_type": config.get("model_type"),
                      "architectures": config.get("architectures"),
                      "hidden_size": config.get("hidden_size"),
                      "num_hidden_layers": config.get("num_hidden_layers"),
                      "vocab_size": config.get("vocab_size"),
                      "torch_dtype": config.get("torch_dtype"),
                  },
                  "files": files,
              }


          def main() -> int:
              parser = argparse.ArgumentParser(description="Inspect and hash an offline local model pack.")
              parser.add_argument("pack", type=Path)
              parser.add_argument("--output", type=Path)
              args = parser.parse_args()

              manifest = inspect_pack(args.pack)
              rendered = json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
              if args.output:
                  args.output.parent.mkdir(parents=True, exist_ok=True)
                  args.output.write_text(rendered, encoding="utf-8")
              print(rendered, end="")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          observed="$(git hash-object "$WORK/inspect_model_pack.py")"
          echo "canonical_inspector_blob_sha=$observed"
          test "$observed" = "$EXPECTED_INSPECT_BLOB_SHA"
          python3 "$WORK/inspect_model_pack.py" "$PACK" --output "$WORK/model-pack-manifest.json" >/dev/null

      - name: Install pinned HF runtime and load offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install --disable-pip-version-check --quiet \
            transformers==5.16.1 tokenizers==0.23.1 safetensors==0.8.0
          TRANSFORMERS_OFFLINE=1 HF_HUB_OFFLINE=1 PACK="$PACK" python3 - <<'PY' > "$WORK/offline-load.json"
          import json
          import os
          import platform
          import torch
          import transformers
          import tokenizers
          import safetensors
          from transformers import AutoModelForCausalLM, AutoTokenizer

          pack = os.environ["PACK"]
          tokenizer = AutoTokenizer.from_pretrained(pack, local_files_only=True)
          model = AutoModelForCausalLM.from_pretrained(pack, local_files_only=True)
          encoded = tokenizer("actuarial offline smoke", return_tensors="pt")
          with torch.no_grad():
              output = model(**encoded)
          logits_shape = list(output.logits.shape)
          if len(logits_shape) != 3 or logits_shape[0] != 1:
              raise SystemExit("unexpected logits shape")
          receipt = {
              "passed": True,
              "runtime": {
                  "python": platform.python_version(),
                  "torch": torch.__version__,
                  "transformers": transformers.__version__,
                  "tokenizers": tokenizers.__version__,
                  "safetensors": safetensors.__version__,
                  "platform": platform.platform(),
              },
              "notes": "GitHub Actions re-download; local_files_only tokenizer/model load and forward pass on exact release bytes.",
              "token_count": int(encoded["input_ids"].shape[1]),
              "logits_shape": logits_shape,
          }
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Build acquisition receipt and emit evidence
        shell: bash
        run: |
          set -euo pipefail
          WORK="$WORK" MODEL_ID="$MODEL_ID" UPSTREAM_REPO="$UPSTREAM_REPO" \
          UPSTREAM_REVISION="$UPSTREAM_REVISION" TOKENIZER_REVISION="$TOKENIZER_REVISION" \
          SLM_MAIN_SHA="$SLM_MAIN_SHA" EXPECTED_ARCHIVE_SHA256="$EXPECTED_ARCHIVE_SHA256" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          work = Path(os.environ["WORK"])
          pack = json.loads((work / "model-pack-manifest.json").read_text(encoding="utf-8"))
          load = json.loads((work / "offline-load.json").read_text(encoding="utf-8"))
          receipt = {
              "schema_version": "0.2",
              "receipt_type": "model_acquisition_observation",
              "model_id": os.environ["MODEL_ID"],
              "upstream_repo": os.environ["UPSTREAM_REPO"],
              "upstream_revision": os.environ["UPSTREAM_REVISION"],
              "tokenizer_revision": os.environ["TOKENIZER_REVISION"],
              "upstream_license_claim": "apache-2.0",
              "local_pack_sha256": pack["pack_sha256"],
              "pack_kind": pack["pack_kind"],
              "custom_code_reviewed": not bool(pack.get("custom_code_files")),
              "offline_load_test": load,
              "transport": {
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
                  "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "workflow_commit": os.environ.get("GITHUB_SHA"),
                  "slm_main_sha": os.environ["SLM_MAIN_SHA"],
                  "archive_sha256": os.environ["EXPECTED_ARCHIVE_SHA256"],
                  "canonical_inspector_blob_sha": "7ca28772fbf6c072a804a6a8265611a8998b768f",
              },
          }
          receipt_path = work / "acquisition-receipt.json"
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          print("===MODEL_PACK_MANIFEST_JSON===")
          print((work / "model-pack-manifest.json").read_text(encoding="utf-8"), end="")
          print("===END_MODEL_PACK_MANIFEST_JSON===")
          print("===ACQUISITION_RECEIPT_JSON===")
          print(receipt_path.read_text(encoding="utf-8"), end="")
          print("===END_ACQUISITION_RECEIPT_JSON===")
          print(f"model_pack_manifest_sha256={sha(work / 'model-pack-manifest.json')}")
          print(f"acquisition_receipt_sha256={sha(receipt_path)}")
          print(f"observed_pack_sha256={pack['pack_sha256']}")
          print(f"observed_weight_sha256={next(x['sha256'] for x in pack['files'] if x['path'] == 'model.safetensors')}")
          PY
