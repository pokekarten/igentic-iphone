name: Verify actuarial tiny model pack

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-actuarial-tiny-pack.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actuarial-tiny-pack-verification
  cancel-in-progress: false

jobs:
  verify-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: actuarial-base-weights-2026-08-31
      ARCHIVE_SHA256: 1b9b273838a337b43daaaf997cb37ffe9d377f9973438c9dcf1a99e517e64799
      PACK_SHA256: 5c0ff179397b9d6c277e1b8b5716bbc7d56b1140353d5af6f178f54b90fedeea
      BASE_REVISION: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
      TOKENIZER_REVISION: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
      PARITY_RECEIPT_SHA256: 4e36db418bdd35ebd44407aae94b413b4e0d3dea2907b1a59ccd259965143d87
      SOURCE_INSPECT_BLOB: 7ca28772fbf6c072a804a6a8265611a8998b768f
      SOURCE_VALIDATE_ACQ_BLOB: 4f19a5c66a992d9613651588f1a2d280b4e719cc
      SOURCE_VERIFY_ACQ_BLOB: 2296f268a8a3c94bf2e01021464183cb4e0eac6c
      SOURCE_NATIVE_BLOB: 02091290ea18beac96258c14480916bd410595f7
      SOURCE_PARITY_GATE_BLOB: cfc6906ebe8df23d464f8b92fbaff6928573fbb3
      SOURCE_RUNNER_BLOB: 6be0247b15a5776883af2c6e9a99060cf34f15e4
      SOURCE_SCORER_BLOB: a507d807e066462ea4b244b3baf18de883cbd696
      SOURCE_BASELINE_BUILDER_BLOB: 00a65432bec3118fccb2c13c69dd2adfe98106bd
      SOURCE_DEV_BLOB: 7587dca22d5a4113d09b638a661800b08e0def26
      SOURCE_EVAL_BLOB: fba47dac8a2efce610f63b294a9488df7d001f26
      SOURCE_REGISTRY_BLOB: 8f18ef7879ee23e0273b7bae8e94e6db1a563527
      SOURCE_ACQ_SPEC_BLOB: 22c0c3b6f0e461c0721ddc8a0cf502e4350d971d
    steps:
      - name: Materialize exact model and SLM gate surfaces
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/actuarial-tiny-baseline"
          mkdir -p "$WORK/scripts" "$WORK/data" "$WORK/models/acquisition" "$WORK/unpacked" "$WORK/out"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'tiny-actuarial-pipeline.tar' --dir "$WORK"
          echo "$ARCHIVE_SHA256  $WORK/tiny-actuarial-pipeline.tar" | sha256sum --check --strict
          tar -xf "$WORK/tiny-actuarial-pipeline.tar" -C "$WORK/unpacked"

          fetch_text() {
            local source="$1" destination="$2"
            gh api "repos/$GITHUB_REPOSITORY/contents/$source?ref=$GITHUB_SHA" --jq .content | tr -d '\n' | base64 -d > "$destination"
          }
          fetch_text Tools/ActuarialTransport/inspect_model_pack.py "$WORK/scripts/inspect_model_pack.py"
          fetch_text Tools/ActuarialTransport/validate_model_pack_against_acquisition.py "$WORK/scripts/validate_model_pack_against_acquisition.py"
          fetch_text Tools/ActuarialTransport/verify_model_acquisition.py "$WORK/scripts/verify_model_acquisition.py"
          fetch_text Tools/ActuarialTransport/native_smol_runtime.py "$WORK/scripts/native_smol_runtime.py"
          fetch_text Tools/ActuarialTransport/native_parity_gate.py "$WORK/scripts/native_parity_gate.py"
          fetch_text Tools/ActuarialTransport/run_actuarialbench_native.py "$WORK/scripts/run_actuarialbench_native.py"
          fetch_text Tools/ActuarialTransport/score_actuarialbench.py "$WORK/scripts/score_actuarialbench.py"
          fetch_text Tools/ActuarialTransport/create_actuarial_baseline_receipt.py "$WORK/scripts/create_actuarial_baseline_receipt.py"
          fetch_text Tools/ActuarialTransport/dev-v0.jsonl "$WORK/data/dev-v0.jsonl"
          fetch_text Tools/ActuarialTransport/actuarialbench-v0.jsonl "$WORK/data/actuarialbench-v0.jsonl"
          fetch_text Tools/ActuarialTransport/native-hf-parity-receipt.json "$WORK/native-hf-parity-receipt.json"
          fetch_text Tools/ActuarialTransport/registry.json "$WORK/models/registry.json"
          fetch_text Tools/ActuarialTransport/tiny-actuarial-pipeline-acquisition.json "$WORK/models/acquisition/tiny-actuarial-pipeline.json"

          test "$(git hash-object "$WORK/scripts/inspect_model_pack.py")" = "$SOURCE_INSPECT_BLOB"
          test "$(git hash-object "$WORK/scripts/validate_model_pack_against_acquisition.py")" = "$SOURCE_VALIDATE_ACQ_BLOB"
          test "$(git hash-object "$WORK/scripts/verify_model_acquisition.py")" = "$SOURCE_VERIFY_ACQ_BLOB"
          test "$(git hash-object "$WORK/scripts/native_smol_runtime.py")" = "$SOURCE_NATIVE_BLOB"
          test "$(git hash-object "$WORK/scripts/native_parity_gate.py")" = "$SOURCE_PARITY_GATE_BLOB"
          test "$(git hash-object "$WORK/scripts/run_actuarialbench_native.py")" = "$SOURCE_RUNNER_BLOB"
          test "$(git hash-object "$WORK/scripts/score_actuarialbench.py")" = "$SOURCE_SCORER_BLOB"
          test "$(git hash-object "$WORK/scripts/create_actuarial_baseline_receipt.py")" = "$SOURCE_BASELINE_BUILDER_BLOB"
          test "$(git hash-object "$WORK/data/dev-v0.jsonl")" = "$SOURCE_DEV_BLOB"
          test "$(git hash-object "$WORK/data/actuarialbench-v0.jsonl")" = "$SOURCE_EVAL_BLOB"
          test "$(git hash-object "$WORK/models/registry.json")" = "$SOURCE_REGISTRY_BLOB"
          test "$(git hash-object "$WORK/models/acquisition/tiny-actuarial-pipeline.json")" = "$SOURCE_ACQ_SPEC_BLOB"
          echo "$PARITY_RECEIPT_SHA256  $WORK/native-hf-parity-receipt.json" | sha256sum --check --strict

          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "PACK=$WORK/unpacked/tiny-actuarial-pipeline" >> "$GITHUB_ENV"

      - name: Install pinned acquisition and native runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install --disable-pip-version-check --quiet \
            transformers==5.16.1 tokenizers==0.23.1 safetensors==0.8.0 regex

      - name: Reverify acquisition on exact bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$WORK/scripts/inspect_model_pack.py" "$PACK" --output "$WORK/out/model-pack-manifest.json" >/dev/null
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["pack_sha256"])' "$WORK/out/model-pack-manifest.json")" = "$PACK_SHA256"
          TRANSFORMERS_OFFLINE=1 HF_HUB_OFFLINE=1 PACK="$PACK" WORK="$WORK" python3 - <<'PY'
          import json, os, platform
          import torch, transformers, tokenizers, safetensors
          from transformers import AutoModelForCausalLM, AutoTokenizer
          pack = os.environ['PACK']
          work = os.environ['WORK']
          tok = AutoTokenizer.from_pretrained(pack, local_files_only=True)
          model = AutoModelForCausalLM.from_pretrained(pack, local_files_only=True)
          encoded = tok('actuarial acquisition verification smoke', return_tensors='pt')
          with torch.no_grad():
              out = model(**encoded)
          shape = list(out.logits.shape)
          if len(shape) != 3 or shape[0] != 1:
              raise SystemExit('unexpected logits shape')
          manifest = json.load(open(f'{work}/out/model-pack-manifest.json'))
          receipt = {
              'schema_version': '0.2',
              'model_id': 'tiny-actuarial-pipeline',
              'upstream_repo': 'HuggingFaceTB/SmolLM2-135M',
              'upstream_revision': '93efa2f097d58c2a74874c7e644dbc9b0cee75a2',
              'tokenizer_revision': '93efa2f097d58c2a74874c7e644dbc9b0cee75a2',
              'upstream_license_claim': 'apache-2.0',
              'local_pack_sha256': manifest['pack_sha256'],
              'pack_kind': manifest['pack_kind'],
              'custom_code_reviewed': not bool(manifest.get('custom_code_files')),
              'offline_load_test': {
                  'passed': True,
                  'runtime': {
                      'python': platform.python_version(),
                      'torch': torch.__version__,
                      'transformers': transformers.__version__,
                      'tokenizers': tokenizers.__version__,
                      'safetensors': safetensors.__version__,
                      'platform': platform.platform(),
                  },
                  'notes': 'Exact GitHub release re-download; local_files_only tokenizer/model load and forward pass.',
                  'token_count': int(encoded['input_ids'].shape[1]),
                  'logits_shape': shape,
              },
          }
          open(f'{work}/out/acquisition-observation.json','w').write(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          PY
          python3 "$WORK/scripts/verify_model_acquisition.py" \
            --receipt "$WORK/out/acquisition-observation.json" \
            --pack-manifest "$WORK/out/model-pack-manifest.json" \
            --registry "$WORK/models/registry.json" \
            --output "$WORK/out/acquisition-verification.json" >/dev/null
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$WORK/out/acquisition-verification.json")" = verified

      - name: Select generation configuration on DEV only
        shell: bash
        run: |
          set -euo pipefail
          for TOKENS in 16 32; do
            python3 "$WORK/scripts/run_actuarialbench_native.py" \
              --model-path "$PACK" \
              --model-id tiny-actuarial-pipeline \
              --model-pack-sha256 "$PACK_SHA256" \
              --base-revision "$BASE_REVISION" \
              --tokenizer-revision "$TOKENIZER_REVISION" \
              --parity-receipt "$WORK/native-hf-parity-receipt.json" \
              --benchmark "$WORK/data/dev-v0.jsonl" \
              --data-class DEV_ONLY \
              --max-new-tokens "$TOKENS" \
              --base-dtype float32 \
              --output-dir "$WORK/out/dev-$TOKENS"
            set +e
            python3 "$WORK/scripts/score_actuarialbench.py" "$WORK/out/dev-$TOKENS/predictions.jsonl" \
              --benchmark "$WORK/data/dev-v0.jsonl" \
              --output "$WORK/out/dev-$TOKENS/score.json" >/dev/null
            RC=$?
            set -e
            echo "DEV scorer exit max_new_tokens=$TOKENS: $RC"
            test -f "$WORK/out/dev-$TOKENS/score.json"
          done
          WORK="$WORK" GITHUB_SHA="$GITHUB_SHA" python3 - <<'PY'
          import json, os
          work=os.environ['WORK']
          rows=[]
          for tokens in (16,32):
              s=json.load(open(f'{work}/out/dev-{tokens}/score.json'))
              rows.append({'max_new_tokens':tokens,'accuracy':s['accuracy'],'passed':s['passed'],'failed':s['failed'],'mean_latency_ms':s.get('mean_latency_ms')})
          def key(row):
              latency=row['mean_latency_ms'] if isinstance(row['mean_latency_ms'],(int,float)) else float('inf')
              return (row['accuracy'],-latency,-row['max_new_tokens'])
          selected=max(rows,key=key)
          receipt={
              'schema_version':'0.1',
              'data_class':'DEV_ONLY',
              'selection_rule':'max accuracy, then lower mean latency, then lower max_new_tokens',
              'candidates':rows,
              'selected':selected,
              'transport_commit':os.environ['GITHUB_SHA'],
              'source_dev_blob':'7587dca22d5a4113d09b638a661800b08e0def26',
          }
          open(f'{work}/out/dev-selection.json','w').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as handle:
              handle.write(f"CHOSEN_MAX_NEW_TOKENS={selected['max_new_tokens']}\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Run frozen unchanged base on EVAL once
        shell: bash
        run: |
          set -euo pipefail
          python3 "$WORK/scripts/run_actuarialbench_native.py" \
            --model-path "$PACK" \
            --model-id tiny-actuarial-pipeline \
            --model-pack-sha256 "$PACK_SHA256" \
            --base-revision "$BASE_REVISION" \
            --tokenizer-revision "$TOKENIZER_REVISION" \
            --parity-receipt "$WORK/native-hf-parity-receipt.json" \
            --benchmark "$WORK/data/actuarialbench-v0.jsonl" \
            --data-class EVAL_ONLY \
            --max-new-tokens "$CHOSEN_MAX_NEW_TOKENS" \
            --base-dtype float32 \
            --output-dir "$WORK/out/base-eval"
          set +e
          python3 "$WORK/scripts/score_actuarialbench.py" "$WORK/out/base-eval/predictions.jsonl" \
            --benchmark "$WORK/data/actuarialbench-v0.jsonl" \
            --output "$WORK/out/base-eval/score.json" >/dev/null
          RC=$?
          set -e
          echo "Base EVAL scorer exit: $RC"
          test -f "$WORK/out/base-eval/score.json"
          python3 "$WORK/scripts/create_actuarial_baseline_receipt.py" \
            --pack-manifest "$WORK/out/model-pack-manifest.json" \
            --acquisition-verification "$WORK/out/acquisition-verification.json" \
            --run-metadata "$WORK/out/base-eval/run-metadata.json" \
            --score "$WORK/out/base-eval/score.json" \
            --output "$WORK/out/base-eval/baseline-receipt.json"

      - name: Emit durable-evidence payloads
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for F in \
            "$WORK/out/model-pack-manifest.json" \
            "$WORK/out/acquisition-observation.json" \
            "$WORK/out/acquisition-verification.json" \
            "$WORK/native-hf-parity-receipt.json" \
            "$WORK/out/dev-selection.json" \
            "$WORK/out/dev-16/predictions.jsonl" \
            "$WORK/out/dev-16/run-metadata.json" \
            "$WORK/out/dev-16/score.json" \
            "$WORK/out/dev-32/predictions.jsonl" \
            "$WORK/out/dev-32/run-metadata.json" \
            "$WORK/out/dev-32/score.json" \
            "$WORK/out/base-eval/predictions.jsonl" \
            "$WORK/out/base-eval/run-metadata.json" \
            "$WORK/out/base-eval/score.json" \
            "$WORK/out/base-eval/baseline-receipt.json"; do
            if test -f "$F"; then
              echo "===BEGIN_FILE:${F#${WORK}/}==="
              cat "$F"
              echo "===END_FILE:${F#${WORK}/}==="
              sha256sum "$F"
            fi
          done
