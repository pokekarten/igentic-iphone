name: One-time safe branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only verified obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          keep = {"main", "agent/commit-email-privacy"}
          ephemeral_prefixes = (
              "agent/", "codex/", "chatgpt/", "claude/", "dependabot/",
              "feat/", "feature/", "fix/", "bugfix/", "hotfix/", "chore/",
              "docs/", "doc/", "research/", "test/", "tests/", "ci/",
              "refactor/", "security/", "experiment/", "benchmark/", "cleanup/"
          )

          def request(method, path):
              req = urllib.request.Request(
                  api + path,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "igentic-iphone-branch-cleanup",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  raise RuntimeError(f"{method} {path} -> HTTP {e.code}: {body}") from e

          def paginate(path):
              page = 1
              while True:
                  sep = "&" if "?" in path else "?"
                  items = request("GET", f"{path}{sep}per_page=100&page={page}")
                  if not items:
                      return
                  yield from items
                  if len(items) < 100:
                      return
                  page += 1

          branches = list(paginate(f"/repos/{repo}/branches"))
          open_pulls = list(paginate(f"/repos/{repo}/pulls?state=open"))
          closed_pulls = list(paginate(f"/repos/{repo}/pulls?state=closed"))

          open_heads = {p["head"]["ref"] for p in open_pulls}
          merged_heads = {}
          for p in closed_pulls:
              if p.get("merged_at") and p.get("base", {}).get("ref") == "main":
                  merged_heads.setdefault(p["head"]["ref"], set()).add(p["head"]["sha"])

          deleted = []
          skipped = []

          for branch in branches:
              name = branch["name"]
              sha = branch["commit"]["sha"]

              if name in keep:
                  skipped.append((name, "explicit keep"))
                  continue
              if branch.get("protected"):
                  skipped.append((name, "protected"))
                  continue
              if name in open_heads:
                  skipped.append((name, "open PR"))
                  continue

              reason = None
              if sha in merged_heads.get(name, set()):
                  reason = "current head is exactly a merged PR head"
              elif name.startswith(ephemeral_prefixes):
                  encoded = urllib.parse.quote(name, safe="")
                  compare = request("GET", f"/repos/{repo}/compare/main...{encoded}")
                  if compare.get("ahead_by") == 0:
                      reason = "temporary branch has no commits outside main"

              if not reason:
                  skipped.append((name, "not proven obsolete"))
                  continue

              encoded = urllib.parse.quote(name, safe="")
              request("DELETE", f"/repos/{repo}/git/refs/heads/{encoded}")
              deleted.append((name, reason))
              print(f"DELETED {name}: {reason}")

          print("\nSUMMARY")
          print(f"branches_seen={len(branches)}")
          print(f"deleted={len(deleted)}")
          print(f"kept={len(skipped)}")
          print("deleted_names=" + json.dumps([n for n, _ in deleted]))
          print("kept_names=" + json.dumps([n for n, _ in skipped]))
          PY
