name: ARTEMIS iOS contract (no device)

# Intentionally PR-only: do not mix untrusted PR execution with manual/default-branch runs.
on:
  pull_request:
    paths:
      - "scripts/igentic_artemis_ios.py"
      - "tests/test_igentic_artemis_ios.py"
      - "docs/integrations/ARTEMIS_IOS.md"
      - ".github/workflows/artemis-ios-contract.yml"

permissions:
  contents: read

jobs:
  offline-contract:
    name: Validate pinned host adapter without installing ARTEMIS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR merge commit without marketplace actions
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git checkout --detach --force "${GITHUB_SHA}"
          git clean -fdx

      - name: Offline Python contract tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_igentic_artemis_ios.py' -v
          python3 -m py_compile scripts/igentic_artemis_ios.py
          python3 scripts/igentic_artemis_ios.py plan
          python3 scripts/validate_repo_structure.py
