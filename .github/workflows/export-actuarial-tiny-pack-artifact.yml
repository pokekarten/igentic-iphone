name: Export actuarial tiny pack artifact

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/export-actuarial-tiny-pack-artifact.yml
      - .github/actions/pinned-upload-artifact/**

permissions:
  contents: read

env:
  BASE_RELEASE_TAG: actuarial-base-weights-2026-08-31
  RUNTIME_RELEASE_TAG: actuarial-hf-runtime-2026-08-31
  BASE_REVISION: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
  BASE_ARCHIVE_SHA256: 1b9b273838a337b43daaaf997cb37ffe9d377f9973438c9dcf1a99e517e64799
  PACK_SHA256: 5c0ff179397b9d6c277e1b8b5716bbc7d56b1140353d5af6f178f54b90fedeea
  WEIGHT_SHA256: 80521b40281d6ce74e35c9282c22539e75aa0ac8578892b2a59955ef78d55da1
  RUNTIME_ARCHIVE_SHA256: 25bf4f4dcb0fac676b1b0076f03f09f0b91c81733b3dba873acadbf4d7bba6e2
  SLM_LAB_REVISION: d0fc2d3cb9990e6d6e03fee53146aa60c936f6b1
  UPLOAD_ARTIFACT_COMMIT: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  export-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact iGentic commit without marketplace checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/..?* 2>/dev/null || true
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/actions/pinned-upload-artifact/action.yml
          test -f .github/actions/pinned-upload-artifact/index.js

      - name: Re-download and verify exact worker inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/actuarial-pack-export"
          mkdir -p "$OUT"
          gh release download "$BASE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'tiny-actuarial-pipeline.tar' --dir "$OUT"
          gh release download "$RUNTIME_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'actuarial-hf-runtime-wheelhouse.tar.gz' --dir "$OUT"
          echo "$BASE_ARCHIVE_SHA256  $OUT/tiny-actuarial-pipeline.tar" | sha256sum --check --strict
          echo "$RUNTIME_ARCHIVE_SHA256  $OUT/actuarial-hf-runtime-wheelhouse.tar.gz" | sha256sum --check --strict
          sha256sum "$OUT/tiny-actuarial-pipeline.tar" "$OUT/actuarial-hf-runtime-wheelhouse.tar.gz"

      - name: Export exact public SLM runner sources
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/slm-lab-source"
          OUT="$RUNNER_TEMP/actuarial-pack-export"
          rm -rf "$SRC"
          git init "$SRC"
          cd "$SRC"
          git remote add origin "https://github.com/pokekarten/agentic-slm-lab.git"
          git fetch --depth=1 origin "$SLM_LAB_REVISION"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SLM_LAB_REVISION"
          FILES=(
            scripts/generate_actuarialbench_v1.py
            scripts/native_smol_runtime.py
            scripts/run_actuarialbench_native.py
            scripts/score_actuarialbench.py
            evals/actuarial/specs/actuarialbench-v1.json
            tests/test_generate_actuarialbench_v1.py
          )
          mkdir -p "$OUT/slm-source"
          for f in "${FILES[@]}"; do
            test -f "$f"
            mkdir -p "$OUT/slm-source/$(dirname "$f")"
            cp --preserve=mode,timestamps "$f" "$OUT/slm-source/$f"
          done
          git ls-files --stage -- "${FILES[@]}" > "$OUT/slm-source-git-stage.txt"
          (cd "$OUT" && sha256sum "${FILES[@]/#/slm-source/}" > slm-source-sha256.txt)
          cat "$OUT/slm-source-git-stage.txt"
          cat "$OUT/slm-source-sha256.txt"

      - name: Write public transport provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'actuarial-pack-export' / 'transport-receipt.json'
          receipt = {
              'schema_version': '1.4',
              'receipt_type': 'public_offline_worker_transport',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_head_sha': os.environ['GITHUB_SHA'],
              'base_release_tag': os.environ['BASE_RELEASE_TAG'],
              'base_asset': 'tiny-actuarial-pipeline.tar',
              'base_archive_sha256': os.environ['BASE_ARCHIVE_SHA256'],
              'pack_sha256': os.environ['PACK_SHA256'],
              'base_revision': os.environ['BASE_REVISION'],
              'weight_sha256': os.environ['WEIGHT_SHA256'],
              'runtime_release_tag': os.environ['RUNTIME_RELEASE_TAG'],
              'runtime_asset': 'actuarial-hf-runtime-wheelhouse.tar.gz',
              'runtime_archive_sha256': os.environ['RUNTIME_ARCHIVE_SHA256'],
              'slm_lab_revision': os.environ['SLM_LAB_REVISION'],
              'slm_source_files': [
                  'scripts/generate_actuarialbench_v1.py',
                  'scripts/native_smol_runtime.py',
                  'scripts/run_actuarialbench_native.py',
                  'scripts/score_actuarialbench.py',
                  'evals/actuarial/specs/actuarialbench-v1.json',
                  'tests/test_generate_actuarialbench_v1.py',
              ],
              'contains_private_dev_eval': False,
              'contains_generated_eval': False,
              'all_transport_archives_sha256_observed_and_verified': True,
              'artifact_uploader_source': 'actions/upload-artifact',
              'artifact_uploader_commit': os.environ['UPLOAD_ARTIFACT_COMMIT'],
              'artifact_uploader_execution': 'local_js_action_bootstrap',
              'marketplace_external_uses_syntax': False,
          }
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
          sha256sum "$RUNNER_TEMP/actuarial-pack-export/transport-receipt.json"

      - name: Upload verified complete tiny worker bundle
        uses: ./.github/actions/pinned-upload-artifact
        with:
          name: tiny-actuarial-offline-worker-bundle-with-slm-source
          path: ${{ runner.temp }}/actuarial-pack-export/
          if-no-files-found: error
          retention-days: '1'
          compression-level: '0'
          overwrite: 'true'
          include-hidden-files: 'false'
