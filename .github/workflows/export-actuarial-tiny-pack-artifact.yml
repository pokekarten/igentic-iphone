name: Export actuarial small split artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/export-actuarial-tiny-pack-artifact.yml
      - .github/actions/pinned-upload-artifact/**

permissions:
  contents: read

env:
  BASE_RELEASE_TAG: actuarial-base-weights-2026-08-31
  BASE_REVISION: a10cc1512eabd3dde888204e902eca88bddb4951
  BASE_ARCHIVE_SHA256: f3addb0635c11dd9b71362feb05dc8f7bb11650e4d56529a0b94c7374352ef69
  WEIGHT_SHA256: e6bffe7435d7ddc10fd3b9a9efd429dafbacb1cb17015fb5562664e7532bf86e
  UPLOAD_ARTIFACT_COMMIT: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  export-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact iGentic commit without marketplace checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/..?* 2>/dev/null || true
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/actions/pinned-upload-artifact/action.yml

      - name: Download, verify and split exact actuarial-small asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/actuarial-small-split"
          mkdir -p "$OUT/full" "$OUT/parts"
          gh release download "$BASE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'actuarial-small.tar' --dir "$OUT/full"
          echo "$BASE_ARCHIVE_SHA256  $OUT/full/actuarial-small.tar" | sha256sum --check --strict
          mkdir -p "$OUT/unpacked"
          tar -xf "$OUT/full/actuarial-small.tar" -C "$OUT/unpacked"
          echo "$WEIGHT_SHA256  $OUT/unpacked/actuarial-small/model.safetensors" | sha256sum --check --strict
          rm -rf "$OUT/unpacked"
          split -b 300M -d -a 2 "$OUT/full/actuarial-small.tar" "$OUT/parts/actuarial-small.tar.part-"
          test "$(find "$OUT/parts" -type f | wc -l)" -eq 3
          sha256sum "$OUT/parts"/* > "$OUT/parts/SHA256SUMS"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'actuarial-small-split'
          parts=sorted(p.name for p in (root/'parts').glob('actuarial-small.tar.part-*'))
          receipt={
            'schema_version':'1.0','receipt_type':'public_split_model_transport',
            'model_id':'actuarial-small','base_revision':os.environ['BASE_REVISION'],
            'base_archive_sha256':os.environ['BASE_ARCHIVE_SHA256'],
            'weight_sha256':os.environ['WEIGHT_SHA256'],
            'parts':parts,'contains_private_dev_eval':False,
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_head_sha':os.environ['GITHUB_SHA']
          }
          (root/'parts'/'transport-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload part 00
        uses: ./.github/actions/pinned-upload-artifact
        with:
          name: actuarial-small-part-00
          path: ${{ runner.temp }}/actuarial-small-split/parts/actuarial-small.tar.part-00
          retention-days: '1'
          compression-level: '0'
          overwrite: 'true'

      - name: Upload part 01
        uses: ./.github/actions/pinned-upload-artifact
        with:
          name: actuarial-small-part-01
          path: ${{ runner.temp }}/actuarial-small-split/parts/actuarial-small.tar.part-01
          retention-days: '1'
          compression-level: '0'
          overwrite: 'true'

      - name: Upload part 02 and receipt
        uses: ./.github/actions/pinned-upload-artifact
        with:
          name: actuarial-small-part-02
          path: |
            ${{ runner.temp }}/actuarial-small-split/parts/actuarial-small.tar.part-02
            ${{ runner.temp }}/actuarial-small-split/parts/SHA256SUMS
            ${{ runner.temp }}/actuarial-small-split/parts/transport-receipt.json
          retention-days: '1'
          compression-level: '0'
          overwrite: 'true'
