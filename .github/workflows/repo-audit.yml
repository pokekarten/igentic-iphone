name: Repo Audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact workflow SHA without marketplace actions
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          git clean -fdx
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Show Python version
        run: python3 --version

      - name: Validate repo structure
        run: python3 scripts/validate_repo_structure.py

      - name: Verify generated Explore indexes
        run: python3 scripts/build_explore_index.py --check

      - name: Test autonomy gate evaluator
        run: python3 scripts/autonomy/test_evaluate_pr.py

      - name: Validate action benchmark
        run: python3 scripts/validate_action_benchmark.py

      - name: Test action proposal evaluator
        run: python3 scripts/test_evaluate_action_proposals.py

      - name: Test Qwen3 baseline adapter
        run: python3 scripts/test_qwen3_baseline_adapter.py

      - name: Test Qwen3 offline host harness
        run: python3 scripts/test_qwen3_host_runner.py

      - name: Test Qwen3 baseline evidence packager
        run: python3 scripts/test_qwen3_baseline_packager.py

      - name: Test commit email privacy bootstrap contract
        run: python3 -m unittest tests.test_check_commit_email_privacy -v

      - name: Validate untouched baseline manifest
        run: python3 scripts/validate_baseline_run.py

      - name: Test untouched baseline manifest validator
        run: python3 scripts/test_validate_baseline_run.py

      - name: Audit public project control files
        run: |
          set -euo pipefail
          required=(
            README.md
            PROJECT_STATE.md
            ROADMAP.md
            GOVERNANCE.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            SUPPORT.md
            docs/GITHUB_CONTROL.md
            docs/VALIDATION.md
            docs/CHATGPT_NEXT_TASK.md
            docs/PUBLIC_REPO_SETUP.md
            docs/OPEN_SOURCE_ISSUE_PLAN.md
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/validation_task.md
          )
          missing=0
          for path in "${required[@]}"; do
            if [ ! -s "$path" ]; then
              echo "Missing or empty: $path"
              missing=1
            fi
          done
          exit "$missing"

      - name: Summarize audit
        run: |
          {
            echo "## Repo Audit"
            echo ""
            echo "Commit: ${GITHUB_SHA}"
            echo ""
            echo "- Exact workflow SHA checkout verified."
            echo "- Repo structure validator completed."
            echo "- Generated Explore documentation and package indexes are synchronized."
            echo "- Autonomy gate evaluator unit tests completed in this contents-read workflow."
            echo "- Canonical action benchmark validation completed."
            echo "- Action proposal evaluator semantic-correctness regression tests completed."
            echo "- Qwen3 baseline adapter, offline host harness and deterministic evidence-packager regression tests completed."
            echo "- Commit email privacy checker and trusted-workflow invariants completed."
            echo "- Untouched baseline provenance validation and profile mutation tests completed."
            echo "- Required public project control files are present and non-empty."
          } >> "$GITHUB_STEP_SUMMARY"
