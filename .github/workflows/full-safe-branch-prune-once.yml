name: One-time full safe branch prune

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-safe-branch-prune-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only branches proven obsolete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GH_REPO%%/*}"
          default_branch="$(gh api "/repos/$GH_REPO" --jq '.default_branch')"
          : >/tmp/deleted.txt
          : >/tmp/kept.txt
          gh api --paginate "/repos/$GH_REPO/branches?per_page=100" --jq '.[] | [.name,.commit.sha,.protected] | @tsv' >/tmp/branches.tsv
          while IFS=$'\t' read -r branch listed_sha protected; do
            [[ -z "$branch" ]] && continue
            if [[ "$branch" == "$default_branch" || "$protected" == true ]]; then
              echo "$branch protected/default" >>/tmp/kept.txt
              continue
            fi
            enc="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            current_json="$(gh api "/repos/$GH_REPO/branches/$enc" 2>/dev/null || true)"
            [[ -n "$current_json" ]] || continue
            current_sha="$(jq -r '.commit.sha' <<<"$current_json")"
            current_protected="$(jq -r '.protected' <<<"$current_json")"
            [[ "$current_sha" == "$listed_sha" && "$current_protected" == false ]] || { echo "$branch moved/protected" >>/tmp/kept.txt; continue; }
            open_prs="$(gh api -X GET "/repos/$GH_REPO/pulls" -f state=open -f "head=$owner:$branch" -f per_page=100 --jq 'length')"
            [[ "$open_prs" == 0 ]] || { echo "$branch open-pr" >>/tmp/kept.txt; continue; }
            ahead="$(gh api "/repos/$GH_REPO/compare/$default_branch...$enc" --jq '.ahead_by')"
            reason=""
            if [[ "$ahead" == 0 ]]; then
              reason="fully-contained-in-$default_branch"
            else
              merged_json="$(gh api -X GET "/repos/$GH_REPO/pulls" -f state=closed -f "head=$owner:$branch" -f per_page=100)"
              merged_exact="$(jq --arg sha "$current_sha" --arg base "$default_branch" '[.[] | select(.merged_at != null and .head.sha == $sha and .base.ref == $base)] | length' <<<"$merged_json")"
              if [[ "$merged_exact" != 0 ]]; then
                reason="exact-head-of-merged-pr"
              fi
            fi
            [[ -n "$reason" ]] || { echo "$branch unique-unmerged" >>/tmp/kept.txt; continue; }
            verify_json="$(gh api "/repos/$GH_REPO/branches/$enc" 2>/dev/null || true)"
            [[ -n "$verify_json" ]] || continue
            verify_sha="$(jq -r '.commit.sha' <<<"$verify_json")"
            verify_protected="$(jq -r '.protected' <<<"$verify_json")"
            verify_open="$(gh api -X GET "/repos/$GH_REPO/pulls" -f state=open -f "head=$owner:$branch" -f per_page=100 --jq 'length')"
            [[ "$verify_sha" == "$current_sha" && "$verify_protected" == false && "$verify_open" == 0 ]] || { echo "$branch changed-before-delete" >>/tmp/kept.txt; continue; }
            gh api --silent -X DELETE "/repos/$GH_REPO/git/refs/heads/$enc"
            echo "$branch $current_sha $reason" | tee -a /tmp/deleted.txt
          done </tmp/branches.tsv
          echo '--- SUMMARY ---'
          echo "deleted=$(wc -l </tmp/deleted.txt | tr -d ' ')"
          echo "kept=$(wc -l </tmp/kept.txt | tr -d ' ')"
          echo 'DELETED:'
          cat /tmp/deleted.txt
          echo 'KEPT:'
          cat /tmp/kept.txt
