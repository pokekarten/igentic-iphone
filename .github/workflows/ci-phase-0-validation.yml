name: Phase 0 CI Validation

on:
  push:
    branches:
      - main
  pull_request:
  # Manual dispatch is deliberately disabled: rerun PR checks from GitHub.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repo-structure:
    name: Validate repo structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository without marketplace actions
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Never run arbitrary workflow_dispatch refs as privileged CI.
          # The event/GitHub-supplied ref is the only accepted checkout.
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            pull_request:refs/pull/*/merge|push:refs/heads/main) ;;
            *) echo "Unsupported event/ref for untrusted-code CI" >&2; exit 1 ;;
          esac
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "${fetched_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Event SHA changed during checkout; rerun the workflow" >&2
            exit 1
          fi
          git checkout --force FETCH_HEAD
          git clean -fdx
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Show Python version
        run: python3 --version

      - name: Validate required files and forbidden artifacts
        run: python3 scripts/validate_repo_structure.py

      - name: Enforce iOS 27-only deployment, build and simulator baseline
        run: |
          python3 scripts/validate_ios27_baseline.py
          python3 -m unittest discover -s scripts -p 'test_ios27_*.py'

  swift-package:
    name: Swift package build and test
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout repository without marketplace actions
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Never run arbitrary workflow_dispatch refs as privileged CI.
          # The event/GitHub-supplied ref is the only accepted checkout.
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            pull_request:refs/pull/*/merge|push:refs/heads/main) ;;
            *) echo "Unsupported event/ref for untrusted-code CI" >&2; exit 1 ;;
          esac
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "${fetched_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Event SHA changed during checkout; rerun the workflow" >&2
            exit 1
          fi
          git checkout --force FETCH_HEAD
          git clean -fdx
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Show Swift version
        run: swift --version

      - name: Compile AgentCore Foundation Models branch with Xcode 27
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          swift build --target AgentCore --scratch-path .build-foundation-models-xcode26

      - name: Build Swift package
        working-directory: ios
        run: swift build

      - name: Run Swift tests
        working-directory: ios
        run: swift test

  apple-foundation-baseline-compile:
    name: Compile Apple Foundation baseline host
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout repository without marketplace actions
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Never run arbitrary workflow_dispatch refs as privileged CI.
          # The event/GitHub-supplied ref is the only accepted checkout.
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            pull_request:refs/pull/*/merge|push:refs/heads/main) ;;
            *) echo "Unsupported event/ref for untrusted-code CI" >&2; exit 1 ;;
          esac
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "${fetched_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Event SHA changed during checkout; rerun the workflow" >&2
            exit 1
          fi
          git checkout --force FETCH_HEAD
          git clean -fdx
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Show Xcode and Swift versions
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Compile real Foundation Models research runner
        working-directory: ios
        run: |
          set -euo pipefail
          swift build --target ModelResearchSupport --scratch-path .build-apple-baseline-current-xcode
          swift build --target AppleFoundationBaselineHost --scratch-path .build-apple-baseline-current-xcode

  swift-package-linux:
    name: Swift package Linux build and test
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15

    steps:
      - name: Checkout repository without marketplace actions
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Never run arbitrary workflow_dispatch refs as privileged CI.
          # The event/GitHub-supplied ref is the only accepted checkout.
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            pull_request:refs/pull/*/merge|push:refs/heads/main) ;;
            *) echo "Unsupported event/ref for untrusted-code CI" >&2; exit 1 ;;
          esac
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "${fetched_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Event SHA changed during checkout; rerun the workflow" >&2
            exit 1
          fi
          git checkout --force FETCH_HEAD
          git clean -fdx

      - name: Show Swift version
        run: swift --version

      - name: Build Swift package on Linux
        working-directory: ios
        run: swift build

      - name: Run Swift tests on Linux
        working-directory: ios
        run: swift test
