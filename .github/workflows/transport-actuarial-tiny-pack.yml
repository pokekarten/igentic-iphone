name: Transport verified actuarial tiny pack

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/transport-actuarial-tiny-pack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: actuarial-base-weights-2026-08-31
      EXPECTED_ARCHIVE_SHA256: 1b9b273838a337b43daaaf997cb37ffe9d377f9973438c9dcf1a99e517e64799
    steps:
      - name: Download and verify exact release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/transport/model" "$RUNNER_TEMP/transport/wheelhouse"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'tiny-actuarial-pipeline.tar' \
            --dir "$RUNNER_TEMP/transport/model"
          echo "$EXPECTED_ARCHIVE_SHA256  $RUNNER_TEMP/transport/model/tiny-actuarial-pipeline.tar" | sha256sum --check --strict

      - name: Download pinned HF runtime wheels
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip download --disable-pip-version-check --only-binary=:all: \
            --dest "$RUNNER_TEMP/transport/wheelhouse" \
            transformers==5.16.1 tokenizers==0.23.1 safetensors==0.8.0
          sha256sum "$RUNNER_TEMP/transport/wheelhouse"/* | sort > "$RUNNER_TEMP/transport/wheelhouse.sha256"
          cat "$RUNNER_TEMP/transport/wheelhouse.sha256"

      - name: Upload exact model transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: actuarial-tiny-model-transport
          path: ${{ runner.temp }}/transport/model/tiny-actuarial-pipeline.tar
          compression-level: 0
          retention-days: 1

      - name: Upload pinned runtime wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: actuarial-tiny-hf-wheelhouse
          path: |
            ${{ runner.temp }}/transport/wheelhouse/
            ${{ runner.temp }}/transport/wheelhouse.sha256
          compression-level: 0
          retention-days: 1
