name: Fieldglass MCP
on:
  pull_request:
    paths:
      - 'products/fieldglass/**'
      - '.github/workflows/fieldglass.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the current revision
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install and test the standalone source archive
        working-directory: products/fieldglass
        run: |
          archive=$(scripts/package-source.sh)
          shasum -a 256 -c "$archive.sha256"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/Fieldglass/plugin"
          npm ci --ignore-scripts --no-audit --no-fund
          CHROME_BIN=/usr/bin/google-chrome npm test
